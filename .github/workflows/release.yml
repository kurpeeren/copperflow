name: Release

# Pushing a version tag (v0.3.1) publishes that version to npm, then builds the desktop app for Windows, macOS and
# Linux (desktop.yml) and attaches the installers to the GitHub release of that tag. No npm token is stored: npm trusts
# this workflow of this repository (npmjs.com, the package's Settings, Trusted publishing), and the publish proves where
# it came from.
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 comes with npm 10.
      - run: npm install -g npm@11
      - name: The tag, package.json and the program agree on the version
        run: |
          package="v$(node -p "require('./package.json').version")"
          test "$package" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package.json $package"; exit 1; }
          grep -q "\"${package#v}\"" src/version.ts || { echo "src/version.ts does not say ${package#v}"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish

  registry:
    needs: publish
    runs-on: ubuntu-latest
    # Lists this version in the official MCP Registry. The registry checks the npm package's mcpName, so this runs after
    # the publish, and the login is GitHub's OIDC token: no secret is stored.
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download mcp-publisher and verify its signature
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json"             --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}"             --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
      - name: The tag's version in server.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
      - name: Wait until npm serves this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 40); do npm view "copperflow@$version" mcpName > /dev/null 2>&1 && exit 0; sleep 15; done
          echo "npm does not serve copperflow@$version yet"; exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  desktop:
    needs: publish
    uses: ./.github/workflows/desktop.yml

  release:
    needs: desktop
    runs-on: ubuntu-latest
    # The only job that can write: it runs no code from the repository or its dependencies.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
      - name: Attach the installers to the release of this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="Desktop app: Windows copperflow-Setup.exe; macOS copperflow-mac-arm64.dmg (Apple silicon) or copperflow-mac-x64.dmg (Intel); Linux copperflow-linux-x86_64.AppImage or copperflow-linux-amd64.deb. Each .sha256 file holds the checksum of the file of the same name. The apps are not signed yet. npm: npx copperflow@$version"
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "copperflow $version" --notes "$notes"
          gh release upload "$GITHUB_REF_NAME" copperflow-* --clobber
