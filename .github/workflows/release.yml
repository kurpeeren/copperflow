name: Release

# Pushing a version tag (v0.3.1) publishes that version to npm. No token is stored: npm trusts this workflow of this
# repository (npmjs.com, the package's Settings, Trusted publishing), and the publish proves where it came from.
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 comes with npm 10.
      - run: npm install -g npm@11
      - name: The tag, package.json and the program agree on the version
        run: |
          package="v$(node -p "require('./package.json').version")"
          test "$package" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package.json $package"; exit 1; }
          grep -q "\"${package#v}\"" src/version.ts || { echo "src/version.ts does not say ${package#v}"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish
