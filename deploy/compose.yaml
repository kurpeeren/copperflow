# Arrangement A (deploy/README.md): the hub in a container, Caddy in front of it in the hub's own network namespace.
# Every value comes from deploy/hub.env (copied from deploy/hub.env.example); start it as README step 6 says.
#
# Why the proxy shares the hub's network namespace: the hub listens on 127.0.0.1 only and answers /_tls-ask only to a
# connection from loopback (src/hub/server.ts), so Caddy must reach it on loopback; in the hub's namespace it does,
# with no change to the hub. The ports below are therefore published on the hub's service and arrive at Caddy.
#
# What the Docker socket means: the hub container drives the host's engine through the mounted socket, and anyone
# who can use that socket is root on the host. A hub compromise is a host compromise in this arrangement; the
# alternative is arrangement B, the hub on the host as a systemd service (deploy/copperflow-hub.service).
#
# IPv4 only as written: publish no AAAA records. IPv6 clients would arrive through docker-proxy from one address, and
# the hub would see one client for all of them (README, "IPv6").

name: copperflow

services:
  hub:
    image: ${CF_HUB_IMAGE}
    container_name: ${CF_HUB_CONTAINER}
    # A minimal init as PID 1: it forwards signals to the hub and reaps the engine commands the hub runs.
    init: true
    user: "${CF_HUB_UID:?set CF_HUB_UID in hub.env}:${CF_HUB_GID:?set CF_HUB_GID in hub.env}"
    group_add:
      - "${CF_WORKSPACE_GID:?set CF_WORKSPACE_GID in hub.env}"
      - "${CF_DOCKER_GID:?set CF_DOCKER_GID in hub.env}"
    command:
      - hub
      - --data
      - ${CF_DATA_DIR}
      - --port
      - "${CF_HUB_PORT}"
      - --bind
      - 127.0.0.1
      - --public-origin
      - https://${CF_PUBLIC_HOST}
      - --workspace-domain
      - ${CF_WORKSPACE_DOMAIN:?set CF_WORKSPACE_DOMAIN in hub.env}
      - --runner
      - container
      - --workspace-image
      - ${CF_WORKSPACE_IMAGE}
      - --container-command
      - docker
      - --workspace-reach
      - network
      - --hub-container
      - ${CF_HUB_CONTAINER}
      - --workspace-group
      - "${CF_WORKSPACE_GID}"
      - --trust-proxy
      - 127.0.0.1
      - --tls-ask-weekly
      - "${CF_TLS_ASK_WEEKLY}"
    volumes:
      # The same path inside as on the host: the host's engine mounts each project folder by the path the hub names.
      - ${CF_DATA_DIR}:${CF_DATA_DIR}
      - /var/run/docker.sock:/var/run/docker.sock
    # Caddy's ports (it runs in this service's network namespace). Nothing else is published.
    ports:
      - "80:80"
      - "443:443"
    networks:
      edge:
        ipv4_address: ${CF_HUB_EDGE_IP}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${CF_HUB_MEMORY}
    cpus: ${CF_HUB_CPUS}
    pids_limit: 512
    restart: unless-stopped
    # The hub stops its workspaces on SIGTERM and exits within 10 seconds.
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${CF_HUB_PORT}/healthz').then((r) => process.exit(r.status === 200 ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  proxy:
    image: ${CF_CADDY_IMAGE:?set CF_CADDY_IMAGE in hub.env, pinned by digest}
    # Caddy runs as root inside its own container: the official image's user, which owns /data and /config. It has no
    # capability but binding ports below 1024, a read-only root and no-new-privileges, and it shares only the hub's
    # network namespace, not its files or the Docker socket.
    network_mode: service:hub
    depends_on:
      hub:
        condition: service_healthy
        # A restarted hub is a new network namespace; Caddy must follow it.
        restart: true
    environment:
      CF_PUBLIC_HOST: ${CF_PUBLIC_HOST}
      CF_WORKSPACE_DOMAIN: ${CF_WORKSPACE_DOMAIN}
      CF_HUB_PORT: "${CF_HUB_PORT}"
      CF_PROXY_BIND: ${CF_HUB_EDGE_IP}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  edge:
    ipam:
      config:
        - subnet: ${CF_EDGE_SUBNET}

volumes:
  caddy-data:
  caddy-config:
