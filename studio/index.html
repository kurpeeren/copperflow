<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>copperflow studio</title>
    <!-- The remembered theme (theme-state.ts, key copperflow.theme) before any style loads, so Dark never flashes light. -->
    <script>
      try {
        if (localStorage.getItem("copperflow.theme") === "dark") document.documentElement.setAttribute("data-theme", "dark")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
