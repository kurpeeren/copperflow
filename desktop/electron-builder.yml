# The installers: Windows copperflow-Setup.exe (for the current user, no administrator rights, a Start menu entry and
# a desktop shortcut), macOS copperflow-mac-<arch>.dmg, Linux copperflow-linux-<arch>.AppImage and .deb. One name for
# every version, so .../releases/latest/download/<name> always gives the newest. The app is desktop/stage
# (scripts/stage.mjs). None is signed yet: the site says what that means for the person.
appId: com.kurpeeren.copperflow
productName: copperflow
copyright: Copyright © Eren Kürpe
directories:
  app: stage
  output: out
  buildResources: build-resources
electronVersion: 45.2.3
# The browser engine's own messages (its context menus, its dialogs) in English and Turkish only; the app is in English.
electronLanguages:
  - en-US
  - tr
# Not packed into one archive: the engine starts worker threads from its own files, and esbuild and the canvas package
# load native files from node_modules, which all need real paths on disk.
asar: false
npmRebuild: false
nodeGypRebuild: false
files:
  - "**/*"
  - "!**/*.map"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build-resources/icon.ico
  artifactName: copperflow-Setup.${ext}
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: copperflow
  uninstallDisplayName: copperflow
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build-resources/icon.png
  category: public.app-category.developer-tools
  # Signed ad hoc ("-"), not with a developer identity: Apple silicon refuses to start a bundle with no signature at
  # all ("damaged"), while an ad hoc one opens after the person allows it once. No identity is looked for
  # (CSC_IDENTITY_AUTO_DISCOVERY is off in the workflow).
  identity: "-"
  artifactName: copperflow-mac-${arch}.${ext}
dmg:
  artifactName: copperflow-mac-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: build-resources/icon.png
  category: Development
  executableName: copperflow
  synopsis: PCB design with the agent you already use
  maintainer: copperflow <noreply@copperflow.kurpeeren.com>
  vendor: copperflow
  artifactName: copperflow-linux-${arch}.${ext}
deb:
  artifactName: copperflow-linux-${arch}.${ext}
appImage:
  artifactName: copperflow-linux-${arch}.${ext}
publish: null
